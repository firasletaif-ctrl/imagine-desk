services:
  - type: web
    name: imagine-events-desk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Base PostgreSQL gérée par Render : les congrès, inscrits et paiements
      # survivent aux redéploiements et aux mises en veille.
      - key: DATABASE_URL
        fromDatabase:
          name: imagine-events-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
      - key: IMAGINE_SETUP_TOKEN
        sync: false
      # Utilisé seulement si DATABASE_URL est absent (secours local, non durable).
      - key: IMAGINE_DB_PATH
        value: /app/data/imagine_desk.sqlite3

databases:
  - name: imagine-events-db
    plan: free
    databaseName: imagine_events
    user: imagine
