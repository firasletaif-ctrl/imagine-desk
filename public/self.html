<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B1D3A">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Imagine Self Check-in — confirmez votre arrivée au congrès.">
  <title>Imagine Self Check-in</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/self.css">
  <script src="/self.js" defer></script>
</head>
<body>
  <main class="self-shell" id="selfShell">
    <header class="self-head">
      <img class="self-logo" src="/img/logo.png" alt="Imagine Events">
      <span class="self-badge">SELF CHECK-IN</span>
    </header>

    <section class="self-card" id="selfCard" aria-live="polite">
      <p class="self-kicker">Chargement du check-in…</p>
    </section>

    <footer class="self-foot">
      <span>Imagine Events · We Make It Real</span>
      <span id="selfClock"></span>
    </footer>
  </main>
  <noscript><p class="self-noscript">Activez JavaScript pour confirmer votre arrivée.</p></noscript>
</body>
</html>
